name: Publish to PyPI

# Runs the test suite, builds the sdist/wheel, and publishes to PyPI --
# only when a GitHub Release is published, or when triggered manually.
# Uses PyPI's Trusted Publishing (OIDC): no API token is stored as a
# secret anywhere. See the one-time setup note at the bottom of this file.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m unittest test_qontext_memory test_llm_judge_bridge

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the GitHub environment name you configure as the trusted
    # publisher's "environment" on PyPI (see setup note below). Delete the
    # `environment:` line entirely if you don't want to gate publishing
    # behind an environment approval.
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing -- do not remove
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

# --------------------------------------------------------------------------
# One-time setup, done on pypi.org, not in this file:
#
# 1. Create the `qontext-memory` project on PyPI once, manually, with a
#    normal upload (`twine upload dist/*`) -- trusted publishing can only be
#    configured for a project that already exists (or via PyPI's newer
#    "pending publisher" flow for a project that doesn't exist yet; either
#    works, the manual-first-upload path is simplest).
# 2. On the project's PyPI page: Manage -> Publishing -> Add a new publisher
#    -> GitHub.
#      Owner:        Nexus-Organization-Infosec
#      Repository:   Qontext-Memory
#      Workflow:     publish.yml
#      Environment:  pypi   (must match the `environment:` line above, or
#                    leave both blank if you removed that line)
# 3. From then on, publishing a GitHub Release (or running this workflow
#    manually) builds and uploads automatically -- no token, ever, in this
#    repo or in GitHub's secrets.
# --------------------------------------------------------------------------
